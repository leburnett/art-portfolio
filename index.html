<!-- NEWS BAR: shared by every page. Same height as the navbar; the landing
     page is sized to 100dvh so this sits on the bottom edge on load.

     TO MAKE IT WORK: replace action="#" with your newsletter provider's
     endpoint and check the field name it expects. Buttondown, free to 100
     subscribers, is:
       action="https://buttondown.email/api/emails/embed-subscribe/YOUR-USERNAME"
       method="post"   field name="email"
-->
<section class="newsbar wrap" id="news">
  <span class="newsbar__mark">&copy; 2026 Laura Elizabeth Burnett</span>
  <form class="newsbar__form" action="#" method="post">
    <span class="newsbar__label">Subscribe to my <b>newsletter</b> for regular updates</span>
    <input type="email" name="email" required
           autocomplete="email" aria-label="Email address"
           placeholder="your@email.com">
    <button type="submit">Subscribe</button>
  </form>
</section>
